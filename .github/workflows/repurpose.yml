name: Reborn Repurpose (link to draft)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "TikTok or Instagram video URL (your own / rights-cleared content)"
        required: true
        type: string
      mode:
        description: "review = edit then wait in drafts for approval; auto = no edits, straight to posts and auto-published"
        required: false
        default: "review"
        type: choice
        options:
          - review
          - auto
      remove_subtitles:
        description: "Remove subtitles (clean, via Replicate GPU inpainting)"
        required: false
        default: false
        type: boolean
      subtitle_method:
        description: "Subtitle removal method: region = fixed band, never flickers (recommended); detect = per-frame, faster but can flicker"
        required: false
        default: "region"
        type: choice
        options:
          - region
          - detect
      subtitle_band:
        description: "Region method: 'auto' auto-detects the text location (recommended). Or force a band as top-bottom fractions of height, e.g. 0.25-0.42."
        required: false
        default: "auto"
        type: string
      remove_music:
        description: "Remove background music, keep the voice (Demucs)"
        required: false
        default: false
        type: boolean
      mute_audio:
        description: "Mute all audio (overrides remove music)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  repurpose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade yt-dlp
          pip install replicate
          # EasyOCR (with torch) auto-detects the subtitle region for the
          # region method; only install it when subtitles are being removed and
          # the band isn't a fixed manual value.
          if [ "${{ inputs.remove_subtitles }}" = "true" ] && [ "${{ inputs.subtitle_method }}" != "detect" ]; then
            pip install easyocr opencv-python-headless
          fi
          # Demucs (with torch) is large, so only install it when music removal
          # is requested.
          if [ "${{ inputs.remove_music }}" = "true" ]; then
            pip install demucs
          fi

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Repurpose video into draft
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          REPURPOSE_MODE: ${{ inputs.mode }}
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          REMOVE_SUBTITLES: ${{ inputs.remove_subtitles }}
          SUBTITLE_METHOD: ${{ inputs.subtitle_method }}
          SUBTITLE_BAND: ${{ inputs.subtitle_band }}
          REMOVE_MUSIC: ${{ inputs.remove_music }}
          MUTE_AUDIO: ${{ inputs.mute_audio }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_DRAFTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_DRAFTS_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          REPURPOSE_TARGET_FOLDER: ${{ secrets.REPURPOSE_TARGET_FOLDER }}
        run: python repurpose.py
