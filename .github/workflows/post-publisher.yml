name: Reborn IG Post Publisher

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/post-publisher.yml"
      - "post_publisher.py"
      - "wordpress_media.py"
      - "asset_helpers.py"
  workflow_dispatch:
    inputs:
      publisher_type:
        description: Choose publisher to run
        required: true
        default: post
        type: choice
        options:
          - post
          - story
          - health
          - email_test
          - token_check
  schedule:
    - cron: "25 6 * * *"
    - cron: "0 3 * * 1"
    - cron: "*/5 * * * *"

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug env presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
        run: |
          python - <<'PY'
          import os

          keys = [
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "META_APP_ID",
              "META_APP_SECRET",
              "MS_TENANT_ID",
              "MS_CLIENT_ID",
              "MS_CLIENT_SECRET",
              "ONEDRIVE_ROOT_PATH",
              "ONEDRIVE_POSTS_FOLDER_NAME",
              "ONEDRIVE_STORIES_FOLDER_NAME",
              "ONEDRIVE_POSTED_FOLDER_NAME",
              "ONEDRIVE_FAILED_FOLDER_NAME",
              "ONEDRIVE_USER_EMAIL",
              "IG_USER_ID",
              "PAGE_ACCESS_TOKEN",
              "META_GRAPH_API_VERSION",
              "DRY_RUN",
              "WP_BASE_URL",
              "WP_USERNAME",
              "WP_APP_PASSWORD",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "ALERT_EMAIL_TO",
              "ALERT_EMAIL_FROM",
              "ALERT_EMAIL_ENABLED",
          ]

          for k in keys:
              print(f"{k}: {'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run selected publisher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            PUBLISHER_TYPE="token_check"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUBLISHER_TYPE="${{ inputs.publisher_type }}"
          else
            PUBLISHER_TYPE="post"
          fi

          echo "Selected publisher: ${PUBLISHER_TYPE}"

          if [ "${PUBLISHER_TYPE}" = "token_check" ]; then
            python token_maintenance.py
          elif [ "${PUBLISHER_TYPE}" = "email_test" ]; then
            python send_test_alert.py
          elif [ "${PUBLISHER_TYPE}" = "health" ]; then
            python health_check.py
          elif [ "${PUBLISHER_TYPE}" = "story" ]; then
            python story_publisher.py
          else
            python post_publisher.py
          fi

      - name: Send failure alert email
        if: failure()
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_REF_VALUE: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            export PUBLISHER_TYPE="token_check"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export PUBLISHER_TYPE="${{ inputs.publisher_type }}"
          else
            export PUBLISHER_TYPE="post"
          fi

          python - <<'PY'
          import os
          from alert_email import send_alert_email

          publisher_type = os.getenv("PUBLISHER_TYPE", "post")
          subject = f"Reborn IG Auto Publisher Failed: {publisher_type}"
          body = "\n".join([
              "Project: Reborn Instagram Auto Publisher",
              f"Publisher type: {publisher_type}",
              f"GitHub workflow name: {os.getenv('WORKFLOW_NAME')}",
              f"GitHub run id: {os.getenv('RUN_ID')}",
              f"GitHub run URL: {os.getenv('RUN_URL')}",
              f"GitHub branch/ref: {os.getenv('GITHUB_REF_VALUE')}",
              f"GitHub commit SHA: {os.getenv('COMMIT_SHA')}",
              "",
              "This email was generated automatically by GitHub Actions.",
          ])

          send_alert_email(subject, body)
          PY
