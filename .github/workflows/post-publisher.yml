name: Reborn IG Post Publisher

on:
  workflow_dispatch:
    inputs:
      publisher_type:
        description: Choose publisher to run
        required: true
        default: post
        type: choice
        options:
          - post
          - story
          - health
          - email_test
          - token_check
          - cleanup
          - generate
          - insights_check
          - insights_report
          - retry_failed
      ad_layout:
        description: "Ad layout (generate only)"
        required: false
        default: random
        type: choice
        options:
          - random
          - campaign
          - hero
          - both
      ad_topic:
        description: "Ad topic key (generate only, blank = random)"
        required: false
        default: ""
        type: string
      ad_count:
        description: "How many ads to generate (generate only, blank = 1)"
        required: false
        default: ""
        type: string
      ad_format:
        description: "Format (generate only)"
        required: false
        default: feed
        type: choice
        options:
          - feed
          - story
      ad_target:
        description: "Target folder (generate only, blank = drafts/stories default)"
        required: false
        default: ""
        type: string
  schedule:
    - cron: "10 23 * * *"
    - cron: "10 3 * * *"
    - cron: "10 7 * * *"
    - cron: "0 3 * * 1"
    - cron: "30 15 * * 0"
    - cron: "30 22 * * *"
    - cron: "0 21 * * *"
    - cron: "0 23 * * 1"
    - cron: "15 */6 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Debug env presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
        run: |
          python - <<'PY'
          import os

          keys = [
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "META_APP_ID",
              "META_APP_SECRET",
              "MS_TENANT_ID",
              "MS_CLIENT_ID",
              "MS_CLIENT_SECRET",
              "ONEDRIVE_ROOT_PATH",
              "ONEDRIVE_POSTS_FOLDER_NAME",
              "ONEDRIVE_STORIES_FOLDER_NAME",
              "ONEDRIVE_POSTED_FOLDER_NAME",
              "ONEDRIVE_FAILED_FOLDER_NAME",
              "ONEDRIVE_USER_EMAIL",
              "IG_USER_ID",
              "PAGE_ACCESS_TOKEN",
              "META_GRAPH_API_VERSION",
              "DRY_RUN",
              "WP_BASE_URL",
              "WP_USERNAME",
              "WP_APP_PASSWORD",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "ALERT_EMAIL_TO",
              "ALERT_EMAIL_FROM",
              "ALERT_EMAIL_ENABLED",
          ]

          for k in keys:
              print(f"{k}: {'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run selected publisher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PUBLISH_ENABLED: ${{ secrets.FB_PUBLISH_ENABLED }}
          CLEANUP_RETENTION_DAYS: ${{ secrets.CLEANUP_RETENTION_DAYS }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ secrets.OPENAI_IMAGE_QUALITY }}
          ONEDRIVE_DRAFTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_DRAFTS_FOLDER_NAME }}
          AD_TOPIC: ${{ inputs.ad_topic || secrets.AD_TOPIC }}
          AD_LAYOUT: ${{ inputs.ad_layout || secrets.AD_LAYOUT }}
          AD_COUNT: ${{ inputs.ad_count || secrets.AD_COUNT }}
          AD_FORMAT: ${{ inputs.ad_format || secrets.AD_FORMAT }}
          AD_TARGET_FOLDER: ${{ inputs.ad_target || secrets.AD_TARGET_FOLDER }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 3 * * 1" ]; then
            PUBLISHER_TYPE="token_check"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 15 * * 0" ]; then
            PUBLISHER_TYPE="cleanup"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 23 * * 1" ]; then
            PUBLISHER_TYPE="insights_report"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "15 */6 * * *" ]; then
            PUBLISHER_TYPE="retry_failed"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "30 22 * * *" ]; then
            # Daily autonomous feed posts: generate 3 ads straight into the publish
            # queue so the 3 daily post crons have fresh content to post.
            PUBLISHER_TYPE="generate"
            export AD_FORMAT="feed"
            export AD_TARGET_FOLDER="${ONEDRIVE_POSTS_FOLDER_NAME:-posts}"
            export AD_LAYOUT="random"
            export AD_COUNT="3"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 21 * * *" ]; then
            # Daily autonomous stories: generate vertical 9:16 stories into the
            # single drop folder ("posts"); aspect-ratio routing sends them to the
            # hourly story publisher.
            PUBLISHER_TYPE="generate"
            export AD_FORMAT="story"
            export AD_TARGET_FOLDER="${ONEDRIVE_POSTS_FOLDER_NAME:-posts}"
            export AD_COUNT="10"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUBLISHER_TYPE="${{ inputs.publisher_type }}"
          else
            PUBLISHER_TYPE="post"
          fi

          echo "Selected publisher: ${PUBLISHER_TYPE}"

          if [ "${PUBLISHER_TYPE}" = "token_check" ]; then
            python token_maintenance.py
          elif [ "${PUBLISHER_TYPE}" = "insights_check" ]; then
            python insights_check.py
          elif [ "${PUBLISHER_TYPE}" = "insights_report" ]; then
            python insights_report.py
          elif [ "${PUBLISHER_TYPE}" = "retry_failed" ]; then
            python retry_failed.py
          elif [ "${PUBLISHER_TYPE}" = "cleanup" ]; then
            python cleanup.py
          elif [ "${PUBLISHER_TYPE}" = "generate" ]; then
            python ad_generator.py
          elif [ "${PUBLISHER_TYPE}" = "email_test" ]; then
            python send_test_alert.py
          elif [ "${PUBLISHER_TYPE}" = "health" ]; then
            python health_check.py
          elif [ "${PUBLISHER_TYPE}" = "story" ]; then
            python story_publisher.py
          else
            python post_publisher.py
          fi

      - name: Upload generated ads (if any)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-ads
          path: out/*.jpg
          if-no-files-found: ignore
