name: Caption checks
on:
  push:
    paths:
      - '*.py'
      - '.github/workflows/caption-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-captions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Python syntax and booking copy without publishing
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          trees = {}
          for path in Path('.').glob('*.py'):
              source = path.read_text(encoding='utf-8')
              compile(source, str(path), 'exec')
              trees[path.name] = ast.parse(source)
          def constant(filename, name):
              for node in trees[filename].body:
                  if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == name for t in node.targets):
                      return ast.literal_eval(node.value)
              raise AssertionError(name)
          footer = constant('post_publisher.py', 'CONTACT_FOOTER')
          assert 'https://bookings.gettimely.com/rebornaesthetics/bb/book' in footer
          assert 'booking confirmation' in footer and '0410 415 415' in footer
          assert 'Services vary by clinic' in footer and 'Upper Floor' in footer
          assert 'complimentary' not in footer.lower()
          assert not any(0x1F300 <= ord(ch) <= 0x1FAFF or 0x1F1E6 <= ord(ch) <= 0x1F1FF for ch in footer)
          for name in ('_FALLBACK_WITH_TREATMENT', '_FALLBACK_GENERIC'):
              variants = constant('asset_helpers.py', name)
              assert len(variants) == 5
              for text in variants:
                  rendered = text.format(t='Skin needling')
                  assert 'Brisbane' in rendered
                  assert 'complimentary' not in rendered.lower()
          fn = next(n for n in trees['post_publisher.py'].body if isinstance(n, ast.FunctionDef) and n.name == 'compose_caption')
          namespace = {'CONTACT_FOOTER': footer, 'build_local_hashtags': lambda brief: '#annerley #fortitudevalley'}
          exec(compile(ast.Module(body=[fn], type_ignores=[]), '<isolated compose_caption>', 'exec'), namespace)
          result = namespace['compose_caption']('Brisbane appointment options.', 'skin needling')
          assert result.startswith('Brisbane appointment options.\n\n') and footer in result
          assert result.endswith('#annerley #fortitudevalley')
          print('All Python files compile. Booking footer, fallback variants and isolated caption composition passed. No publisher or external service called.')
          import os, re, sys
          from types import SimpleNamespace
          class FakeHTTPError(Exception):
              def __init__(self, status):
                  self.response = SimpleNamespace(status_code=status)
                  super().__init__(f'HTTP {status}')
          retry_nodes = [n for n in trees['retry_failed.py'].body if isinstance(n, ast.FunctionDef) and n.name in ('find_named_folder', 'retry_count', 'bump_name', 'mark_dead', 'main')]
          def exercise_retry(name, failure=None):
              moves, alerts, logs = [], [], []
              folders = {'project': [{'id': 'queue', 'name': 'posts', 'folder': {}}, {'id': 'failed', 'name': 'failed', 'folder': {}}], 'failed': [{'id': 'failed-posts', 'name': 'posts', 'folder': {}}], 'failed-posts': [] if name is None else [{'id': 'media', 'name': name}]}
              def fake_move(token, item_id, target_id, new_name):
                  moves.append((item_id, target_id, new_name))
                  if failure is not None:
                      raise failure
                  return {'id': item_id, 'name': new_name}
              ns = {'os': os, 're': re, 'sys': sys, 'requests': SimpleNamespace(HTTPError=FakeHTTPError), 'MAX_RETRIES': 3, 'DEAD_MARKER': '__dead', 'ONEDRIVE_POSTS_FOLDER_NAME': 'posts', 'ONEDRIVE_STORIES_FOLDER_NAME': 'stories', 'ONEDRIVE_FAILED_FOLDER_NAME': 'failed', 'validate_env': lambda: None, 'get_access_token': lambda: 'fake', 'get_project_folder': lambda token: {'id': 'project'}, 'get_children': lambda token, folder_id: folders.get(folder_id, []), 'is_supported_media_file': lambda name: True, 'move_item': fake_move, 'send_alert_safely': lambda *args: alerts.append(args), 'print': lambda *args: logs.append(' '.join(map(str, args)))}
              exec(compile(ast.Module(body=retry_nodes, type_ignores=[]), '<isolated retry>', 'exec'), ns)
              try:
                  ns['main']()
              except SystemExit as result:
                  return result.code, moves, alerts, logs
              raise AssertionError('Retry must report an exit status')
          status, moves, alerts, logs = exercise_retry('Skin needling.jpg')
          assert status == 0 and moves == [('media', 'queue', 'Skin needling__try1.jpg')] and not alerts, 'Successful move must pass without alert'
          status, moves, alerts, logs = exercise_retry(None)
          assert status == 0 and not moves and not alerts, 'Empty queue must pass'
          for failure in (FakeHTTPError(409), RuntimeError('Temporary move failure')):
              status, moves, alerts, logs = exercise_retry('Skin needling.jpg', failure)
              assert status == 1 and len(moves) == 1 and not alerts, 'Unresolved move must fail without duplicate rename, overwrite or extra email'
          status, moves, alerts, logs = exercise_retry('Skin needling__try3.jpg', RuntimeError('Retirement move failure'))
          assert status == 1 and len(moves) == 1 and not alerts, 'Failed retirement must not report success'
          status, moves, alerts, logs = exercise_retry('Skin needling__try3.jpg')
          assert status == 0 and moves == [('media', 'failed-posts', 'Skin needling__try3__dead.jpg')] and len(alerts) == 1, 'Successful retirement keeps existing single alert behavior'
          print('Six isolated retry scenarios passed; no network, real files moved or emails sent.')
          PY

  check-story-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg for isolated video fixtures
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and verify booking prompts without publishing
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path
          from unittest.mock import patch
          import video_transcode as video
          out = Path('story-video-preview')
          out.mkdir(exist_ok=True)
          results = []
          def run(args):
              return subprocess.run(args, check=True, capture_output=True, text=True, timeout=180)
          for name, size, audio in [('landscape', '640x360', False), ('portrait', '360x640', True), ('square', '480x480', False)]:
              source = out / (name + '.mp4')
              args = ['ffmpeg', '-y', '-f', 'lavfi', '-i', 'color=c=0xAAA092:s=' + size + ':r=30:d=3']
              if audio:
                  args += ['-f', 'lavfi', '-i', 'sine=frequency=440:sample_rate=44100:duration=3']
              args += ['-c:v', 'libx264', '-pix_fmt', 'yuv420p']
              if audio:
                  args += ['-c:a', 'aac', '-shortest']
              run(args + [str(source)])
              before = hashlib.sha256(source.read_bytes()).hexdigest()
              encoded = video.ensure_h264(str(source), story_booking_cta=True)
              assert encoded != str(source), 'Must not silently return the unlabelled original'
              assert hashlib.sha256(source.read_bytes()).hexdigest() == before, 'Source must remain unchanged'
              probe = json.loads(run(['ffprobe', '-v', 'error', '-show_streams', '-show_format', '-of', 'json', encoded]).stdout)
              v = next(s for s in probe['streams'] if s['codec_type'] == 'video')
              a = next(s for s in probe['streams'] if s['codec_type'] == 'audio')
              assert (v['codec_name'], v['width'], v['height'], v['pix_fmt']) == ('h264', 1080, 1920, 'yuv420p')
              assert a['codec_name'] == 'aac' and int(a['sample_rate']) == 44100
              assert 2.9 <= float(probe['format']['duration']) <= 3.2
              run(['ffmpeg', '-y', '-ss', '1', '-i', encoded, '-frames:v', '1', str(out / (name + '.png'))])
              run(['ffmpeg', '-y', '-ss', '1', '-i', encoded, '-frames:v', '1', '-vf', 'scale=390:693', str(out / (name + '-phone.png'))])
              results.append({'fixture': name, 'source_audio': audio, 'output': encoded, 'video': 'h264 1080x1920', 'audio': 'aac 44100', 'source_preserved': True})
          with patch.object(video, 'has_tool', return_value=False):
              assert video.ensure_h264('missing.mp4') == 'missing.mp4'
              try:
                  video.ensure_h264('missing.mp4', story_booking_cta=True)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('Story mode must fail closed when FFmpeg is missing')
          with patch.object(video.os.path, 'isfile', return_value=False):
              try:
                  video.story_booking_filter()
              except RuntimeError:
                  pass
              else:
                  raise AssertionError('Missing font must be explicit')
          import base64
          print('PHONE_PREVIEW_PNG=' + base64.b64encode((out / 'portrait-phone.png').read_bytes()).decode('ascii'))
          (out / 'checks.json').write_text(json.dumps(results, indent=2))
          print('Three real FFmpeg renders passed; originals preserved, audio present, no posts or appointments created.')
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: story-booking-preview
          path: story-video-preview/
          retention-days: 7
