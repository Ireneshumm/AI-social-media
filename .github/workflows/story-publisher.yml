name: Reborn IG Story Publisher

on:
  workflow_dispatch:
  schedule:
    # ~18 Stories/day via 9 fixed Brisbane slots x STORIES_PER_RUN=2 (= ~108/week,
    # clears the Meta weekly plan of 102). Fixed slots are predictable, unlike the
    # previous hourly cron whose fire count GitHub throttles unpredictably (which
    # also risked overshooting IG's ~50 published-items/24h cap). Times are UTC;
    # Brisbane = UTC + 10h. Minutes kept off :00 to dodge GitHub's busiest crons.
    - cron: "10 22 * * *"   # 08:10 Brisbane
    - cron: "40 23 * * *"   # 09:40 Brisbane
    - cron: "10 1 * * *"    # 11:10 Brisbane
    - cron: "40 2 * * *"    # 12:40 Brisbane
    - cron: "10 4 * * *"    # 14:10 Brisbane
    - cron: "40 5 * * *"    # 15:40 Brisbane
    - cron: "10 7 * * *"    # 17:10 Brisbane
    - cron: "10 9 * * *"    # 19:10 Brisbane
    - cron: "10 11 * * *"   # 21:10 Brisbane

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Debug env presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          STORIES_PER_RUN: ${{ secrets.STORIES_PER_RUN }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
        run: |
          python - <<'PY'
          import os

          keys = [
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "META_APP_ID",
              "META_APP_SECRET",
              "MS_TENANT_ID",
              "MS_CLIENT_ID",
              "MS_CLIENT_SECRET",
              "ONEDRIVE_ROOT_PATH",
              "ONEDRIVE_POSTS_FOLDER_NAME",
              "ONEDRIVE_STORIES_FOLDER_NAME",
              "ONEDRIVE_POSTED_FOLDER_NAME",
              "ONEDRIVE_FAILED_FOLDER_NAME",
              "ONEDRIVE_USER_EMAIL",
              "IG_USER_ID",
              "PAGE_ACCESS_TOKEN",
              "META_GRAPH_API_VERSION",
              "DRY_RUN",
              "WP_BASE_URL",
              "WP_USERNAME",
              "WP_APP_PASSWORD",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "ALERT_EMAIL_TO",
              "ALERT_EMAIL_FROM",
              "ALERT_EMAIL_ENABLED",
          ]

          for k in keys:
              print(f"{k}: {'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run story publisher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          # 3 stories per run. GitHub's actual fire count for the 9 scheduled story
          # slots swings widely day to day for this account (observed 4/day and
          # 10/day on consecutive days). At 2/run that gave ~8-20/day (a bad day
          # dips under target); at 3/run it is ~12-30/day, averaging ~21 and
          # clearing 102/week even on a slow day. Worst case (a high-fire 10-slot
          # day): 10x3=30 stories + 9 posts = 39 IG publishes/day, safely under
          # IG's ~50 published-items/24h cap (4/run would risk it: 10x4+9=49).
          STORIES_PER_RUN: "3"
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PUBLISH_ENABLED: ${{ secrets.FB_PUBLISH_ENABLED }}
        run: |
          echo "Selected publisher: story"
          # DRY_RUN can still verify assets without a live Meta credential.
          if [ "${DRY_RUN,,}" != "true" ]; then
            echo "Checking Meta authorization before processing publish assets..."
            python token_maintenance.py || exit $?
          fi
          python story_publisher.py
