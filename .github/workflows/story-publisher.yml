name: Reborn IG Story Publisher

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish-story:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Debug env presence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
        run: |
          python - <<'PY'
          import os

          keys = [
              "OPENAI_API_KEY",
              "OPENAI_MODEL",
              "META_APP_ID",
              "META_APP_SECRET",
              "MS_TENANT_ID",
              "MS_CLIENT_ID",
              "MS_CLIENT_SECRET",
              "ONEDRIVE_ROOT_PATH",
              "ONEDRIVE_POSTS_FOLDER_NAME",
              "ONEDRIVE_STORIES_FOLDER_NAME",
              "ONEDRIVE_POSTED_FOLDER_NAME",
              "ONEDRIVE_FAILED_FOLDER_NAME",
              "ONEDRIVE_USER_EMAIL",
              "IG_USER_ID",
              "PAGE_ACCESS_TOKEN",
              "META_GRAPH_API_VERSION",
              "DRY_RUN",
              "WP_BASE_URL",
              "WP_USERNAME",
              "WP_APP_PASSWORD",
              "SMTP_HOST",
              "SMTP_PORT",
              "SMTP_USERNAME",
              "SMTP_PASSWORD",
              "ALERT_EMAIL_TO",
              "ALERT_EMAIL_FROM",
              "ALERT_EMAIL_ENABLED",
          ]

          for k in keys:
              print(f"{k}: {'OK' if os.getenv(k) else 'MISSING'}")
          PY

      - name: Run story publisher
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          ONEDRIVE_ROOT_PATH: ${{ secrets.ONEDRIVE_ROOT_PATH }}
          ONEDRIVE_POSTS_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTS_FOLDER_NAME }}
          ONEDRIVE_STORIES_FOLDER_NAME: ${{ secrets.ONEDRIVE_STORIES_FOLDER_NAME }}
          ONEDRIVE_POSTED_FOLDER_NAME: ${{ secrets.ONEDRIVE_POSTED_FOLDER_NAME }}
          ONEDRIVE_FAILED_FOLDER_NAME: ${{ secrets.ONEDRIVE_FAILED_FOLDER_NAME }}
          ONEDRIVE_USER_EMAIL: ${{ secrets.ONEDRIVE_USER_EMAIL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ secrets.META_GRAPH_API_VERSION }}
          DRY_RUN: ${{ secrets.DRY_RUN }}
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_ENABLED: ${{ secrets.ALERT_EMAIL_ENABLED }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PUBLISH_ENABLED: ${{ secrets.FB_PUBLISH_ENABLED }}
        run: |
          echo "Selected publisher: story"
          python story_publisher.py
